services:

  # 1. PostgreSQL Database Service
  db:
    image: postgres:17-alpine
    container_name: coffee_shop_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coffee_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coffee_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-coffee_shop}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-coffee_admin} -d $${POSTGRES_DB:-coffee_shop}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 2. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coffee_shop_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-coffee_admin}:${POSTGRES_PASSWORD:-coffee_password_123}@db:5432/${POSTGRES_DB:-coffee_shop}
      TEST_DATABASE_URL: sqlite:///./test.sqlite
      TESTING: "false"
      SECRET_KEY: ${SECRET_KEY:-replace_with_a_super_secret_jwt_key_at_least_32_characters_long}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost,http://127.0.0.1:5173}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@coffeeshop.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Coffee Shop API}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 3. React Frontend Service (Served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: coffee_shop_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: